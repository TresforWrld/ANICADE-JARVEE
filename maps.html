<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANICADE ATLAS Tactical Map Core</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #02060b;
      font-family: 'Rajdhani', 'Orbitron', sans-serif;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #02060b;
    }
    
    /* Tactical Theme Filters for Night Grid */
    .tactical-night-grid {
      filter: hue-rotate(180deg) invert(0.9) contrast(1.1) brightness(0.85);
    }
    .tactical-night-grid .leaflet-tile-container {
      opacity: 0.8;
    }

    /* Floating Tactical Details Panel */
    .tactical-hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(2, 6, 11, 0.85);
      border: none;
      outline: none;
      border-radius: 8px;
      padding: 12px;
      color: #c3f5ff;
      width: 240px;
      font-size: 13px;
      box-shadow: none;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      display: none;
    }
    .tactical-hud h4 {
      margin: 0 0 8px 0;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      font-size: 12px;
      color: #00daf3;
      border-bottom: 1px solid rgba(0, 218, 243, 0.2);
      padding-bottom: 4px;
      letter-spacing: 1px;
    }
    .route-steps {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 8px;
      padding-right: 4px;
      font-size: 11px;
      color: rgba(195, 245, 255, 0.8);
    }
    .route-step-item {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    /* Scrollbar */
    .route-steps::-webkit-scrollbar {
      width: 3px;
    }
    .route-steps::-webkit-scrollbar-thumb {
      background: rgba(0, 218, 243, 0.3);
      border-radius: 2px;
    }

    /* Custom Leaflet Controls Style */
    .leaflet-bar {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      border-radius: 4px !important;
      overflow: hidden;
    }
    .leaflet-bar a {
      background-color: rgba(2, 6, 11, 0.9) !important;
      color: #00daf3 !important;
      border: none !important;
    }
    .leaflet-bar a:hover {
      background-color: rgba(0, 218, 243, 0.15) !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <!-- Floating HUD for Turn-by-Turn Routing & Telemetry -->
  <div id="tacticalHud" class="tactical-hud">
    <h4 id="hudTitle">Tactical Routing</h4>
    <div id="hudContent">
      <div>Distance: <span id="routeDistance">--</span></div>
      <div>Duration: <span id="routeDuration">--</span></div>
    </div>
    <div id="routeSteps" class="route-steps"></div>
  </div>

  <script>
    // Constants
    const HOME_COORDINATES = [-14.4430, 28.4457]; // Kabwe, Zambia approx creator coordinates
    
    // Initialize Map
    const map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView(HOME_COORDINATES, 13);
    setTimeout(() => map.invalidateSize(true), 250);
    window.addEventListener('resize', () => map.invalidateSize(true));

    // Layer Definitions
    const tileLayers = {
      roads: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
      }),
      night: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20
      })
    };

    // Default layer: Night Grid (looks very sci-fi)
    let currentBaseLayer = tileLayers.night;
    currentBaseLayer.addTo(map);
    document.getElementById('map').classList.add('tactical-night-grid');

    // Overlays
    let oilLinesLayer = L.layerGroup();
    let swampsLayer = L.layerGroup();
    let trafficLayer = L.layerGroup();
    let routingLayer = L.layerGroup().addTo(map);

    // Simulated Oil Pipeline path (Tazama pipeline nodes in Zambia)
    // From Ndola -> Kabwe -> Lusaka -> Livingstone
    const pipelineCoords = [
      [-12.9816, 28.6498], // Ndola
      [-13.6000, 28.5200], // node
      [-14.4430, 28.4457], // Kabwe (Home)
      [-15.0000, 28.2500], // node
      [-15.4208, 28.2872], // Lusaka
      [-16.3000, 27.6000], // node
      [-17.8500, 25.8600]  // Livingstone
    ];
    
    const pipelinePolyline = L.polyline(pipelineCoords, {
      color: '#00ffff',
      weight: 3,
      opacity: 0.85,
      dashArray: '8, 8',
      className: 'oil-pipeline-glow'
    });
    
    // Add pipeline labels/markers
    L.circleMarker([-12.9816, 28.6498], { radius: 5, color: '#00ffff', fillColor: '#02060b', fillOpacity: 1 }).bindPopup("Ndola Oil Terminal").addTo(oilLinesLayer);
    L.circleMarker([-14.4430, 28.4457], { radius: 5, color: '#00ffff', fillColor: '#02060b', fillOpacity: 1 }).bindPopup("Kabwe Booster Station").addTo(oilLinesLayer);
    L.circleMarker([-15.4208, 28.2872], { radius: 5, color: '#00ffff', fillColor: '#02060b', fillOpacity: 1 }).bindPopup("Lusaka Depot").addTo(oilLinesLayer);
    pipelinePolyline.addTo(oilLinesLayer);

    // Swamps: Lukanga Swamp (west of Kabwe)
    const lukangaPolygon = L.polygon([
      [-14.15, 27.40],
      [-14.05, 27.60],
      [-14.10, 27.85],
      [-14.35, 27.90],
      [-14.45, 27.65],
      [-14.30, 27.35]
    ], {
      color: '#10b981',
      fillColor: '#10b981',
      fillOpacity: 0.25,
      weight: 1.5
    }).bindPopup("Lukanga Swamp (Wetland Conservation Area)");
    lukangaPolygon.addTo(swampsLayer);

    // Traffic Overlays (Simulated color coded flow on main trunk roads around Lusaka/Kabwe)
    const trafficLines = [
      L.polyline([[-14.4430, 28.4457], [-14.5000, 28.4200]], { color: '#ef4444', weight: 4, opacity: 0.8 }), // heavy traffic south of Kabwe
      L.polyline([[-14.5000, 28.4200], [-14.8000, 28.3200]], { color: '#f59e0b', weight: 4, opacity: 0.8 }), // moderate traffic
      L.polyline([[-14.8000, 28.3200], [-15.4208, 28.2872]], { color: '#22c55e', weight: 4, opacity: 0.8 })  // clear flow north of Lusaka
    ];
    trafficLines.forEach(line => line.addTo(trafficLayer));

    // Home Marker
    const homeIcon = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#00daf3; width:12px; height:12px; border-radius:50%; border:none; outline:none; box-shadow:0 0 10px #00daf3;"></div>`,
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });
    const homeMarker = L.marker(HOME_COORDINATES, { icon: homeIcon }).addTo(map).bindPopup("ANICADE Tactical Base (Home)");

    // Sound alert emitter function back to parent
    function emitSoundNotification(soundName) {
      window.parent.postMessage({ type: 'play_sound', sound: soundName }, '*');
    }

    // Switch Map Mode Layer
    function setMapMode(mode) {
      map.removeLayer(currentBaseLayer);
      
      const mapEl = document.getElementById('map');
      mapEl.classList.remove('tactical-night-grid');

      if (mode === 'satellite') {
        currentBaseLayer = tileLayers.satellite;
      } else if (mode === 'roads') {
        currentBaseLayer = tileLayers.roads;
      } else {
        currentBaseLayer = tileLayers.night;
        mapEl.classList.add('tactical-night-grid');
      }

      currentBaseLayer.addTo(map);
      emitSoundNotification('map_shift');
    }

    // Toggle specific tactical overlays
    function toggleOverlay(overlayName, show) {
      const overlays = {
        oil: oilLinesLayer,
        swamps: swampsLayer,
        traffic: trafficLayer
      };
      const layer = overlays[overlayName];
      if (!layer) return;

      if (show) {
        map.addLayer(layer);
        emitSoundNotification('widget_expansion');
      } else {
        map.removeLayer(layer);
      }
    }

    // Zoom Functions
    function zoomMap(delta) {
      if (delta > 0) {
        map.zoomIn();
      } else {
        map.zoomOut();
      }
      emitSoundNotification('scroll');
    }

    // Direct routing using free OSRM Routing Service API
    async function calculateRoute(fromName, toName, fromCoords, toCoords) {
      // Clear previous routes
      routingLayer.clearLayers();
      
      const hud = document.getElementById('tacticalHud');
      const stepsContainer = document.getElementById('routeSteps');
      const distanceSpan = document.getElementById('routeDistance');
      const durationSpan = document.getElementById('routeDuration');
      
      stepsContainer.innerHTML = "Calculating route coordinates...";
      hud.style.display = "block";
      
      // Resolve coordinates if name matches common locations
      const locations = {
        'home': HOME_COORDINATES,
        'kabwe': HOME_COORDINATES,
        'lusaka': [-15.4208, 28.2872],
        'ndola': [-12.9816, 28.6498],
        'livingstone': [-17.8500, 25.8600],
        'airport': [-15.3308, 28.4526] // Kenneth Kaunda Int Airport approx
      };

      let start = fromCoords || locations[fromName.toLowerCase()];
      let end = toCoords || locations[toName.toLowerCase()];

      // Fallbacks if unresolved
      if (!start) {
        start = HOME_COORDINATES; // Default origin
      }
      if (!end) {
        // Try searching coordinate arrays or default to Lusaka
        end = locations['lusaka'];
      }

      emitSoundNotification('route_calculation');

      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("OSRM Routing failed");
        
        const data = await res.json();
        if (!data.routes || !data.routes.length) {
          stepsContainer.innerHTML = "No route found between coordinates.";
          return;
        }

        const route = data.routes[0];
        const routeDistanceKm = (route.distance / 1000).toFixed(1);
        const routeDurationMin = Math.round(route.duration / 60);

        distanceSpan.textContent = `${routeDistanceKm} km`;
        durationSpan.textContent = `${routeDurationMin} mins`;

        // Draw Route line
        const routeGeoJSON = L.geoJSON(route.geometry, {
          style: {
            color: '#00daf3',
            weight: 5,
            opacity: 0.85,
            className: 'tactical-route-line'
          }
        }).addTo(routingLayer);

        // Fit map bounds
        map.fitBounds(routeGeoJSON.getBounds(), { padding: [40, 40] });

        // Add start and end custom markers
        L.marker(start).addTo(routingLayer).bindPopup(`Origin: ${fromName}`);
        L.marker(end).addTo(routingLayer).bindPopup(`Destination: ${toName}`);

        // Populate step-by-step
        stepsContainer.innerHTML = "";
        const steps = route.legs[0].steps;
        steps.forEach((step, i) => {
          const stepItem = document.createElement('div');
          stepItem.className = "route-step-item";
          const modifier = step.maneuver.modifier ? ` (${step.maneuver.modifier})` : "";
          stepItem.textContent = `${i + 1}. ${step.maneuver.type}${modifier} for ${Math.round(step.distance)} meters`;
          stepsContainer.appendChild(stepItem);
        });

        // Post success back to parent to speak the route brief
        window.parent.postMessage({
          type: 'route_complete',
          distance: routeDistanceKm,
          duration: routeDurationMin,
          from: fromName,
          to: toName
        }, '*');

        emitSoundNotification('completion');

      } catch (err) {
        console.error("OSRM Route fetching failed:", err);
        stepsContainer.innerHTML = "Route calculations failed. Offline grid active.";
        emitSoundNotification('error');
      }
    }

    // Coordinate targeted scrolling / centering
    function centerLocation(name) {
      const locations = {
        'kabwe': HOME_COORDINATES,
        'home': HOME_COORDINATES,
        'my location': HOME_COORDINATES,
        'creator location': HOME_COORDINATES,
        'back to base': HOME_COORDINATES,
        'hfh5+j8w, kabwe, zambia': HOME_COORDINATES,
        'ndola': [-12.9816, 28.6498],
        'livingstone': [-17.8500, 25.8600],
        'lusaka': [-15.4208, 28.2872],
        'airport': [-15.3308, 28.4526]
      };
      const key = String(name || '').toLowerCase().trim();
      const coords = locations[key] || Object.entries(locations).find(([label]) => key.includes(label))?.[1];
      if (coords) {
        map.flyTo(coords, 14, {
          animate: true,
          duration: 1.5
        });
        emitSoundNotification('map_shift');
      }
    }

    // Message Listener for Parent Communication
    window.addEventListener('message', async (e) => {
      const msg = e.data;
      if (!msg || typeof msg !== 'object') return;

      switch(msg.type) {
        case 'set_mode':
          setMapMode(msg.mode);
          break;
        case 'toggle_overlay':
          toggleOverlay(msg.overlay, msg.show);
          break;
        case 'zoom':
          zoomMap(msg.delta);
          break;
        case 'route':
          calculateRoute(msg.from, msg.to, msg.fromCoords, msg.toCoords);
          break;
        case 'focus':
          centerLocation(msg.location);
          break;
      }
    });

  </script>
</body>
</html>
