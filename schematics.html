<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANICADE SCHEMA Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060b;
      color: #c3f5ff;
      font-family: "Rajdhani", "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr;
      background:
        radial-gradient(circle at 55% 48%, rgba(0, 218, 243, 0.18), transparent 32%),
        linear-gradient(120deg, rgba(0, 104, 237, 0.10), transparent 44%),
        #02060b;
    }
    .sidebar {
      padding: 18px;
      background: rgba(2, 6, 11, 0.5);
      backdrop-filter: blur(16px);
    }
    h1 {
      margin: 0 0 8px;
      font-family: "Orbitron", "Segoe UI", sans-serif;
      font-size: 18px;
      letter-spacing: 0;
      color: #00daf3;
    }
    .subject {
      margin-bottom: 18px;
      color: rgba(195, 245, 255, 0.72);
      font-size: 13px;
    }
    button {
      width: 100%;
      margin: 0 0 8px;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: rgba(16, 20, 26, 0.6);
      color: #c3f5ff;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    button.active,
    button:hover {
      background: rgba(0, 218, 243, 0.14);
      box-shadow: inset 0 0 18px rgba(0, 218, 243, 0.18);
    }
    .stage {
      position: relative;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .readout {
      position: absolute;
      right: 18px;
      bottom: 18px;
      width: min(340px, calc(100% - 36px));
      padding: 14px;
      background: rgba(2, 6, 11, 0.52);
      backdrop-filter: blur(14px);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(195, 245, 255, 0.82);
    }
    .readout strong {
      display: block;
      margin-bottom: 6px;
      color: #00daf3;
      font-family: "Orbitron", "Segoe UI", sans-serif;
      font-size: 12px;
    }
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      h1, .subject { grid-column: 1 / -1; }
      button { margin: 0; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1>SCHEMA VIEWER</h1>
    <div id="subject" class="subject">Core architecture</div>
    <button type="button" data-layer="all" class="active">All layers</button>
    <button type="button" data-layer="power">Power grid</button>
    <button type="button" data-layer="data">Data flow</button>
    <button type="button" data-layer="thermal">Thermal map</button>
    <button type="button" data-layer="rack">Server rack</button>
  </aside>
  <main class="stage">
    <canvas id="schematicCanvas"></canvas>
    <div class="readout">
      <strong id="layerTitle">All layers active</strong>
      <span id="layerDescription">Displaying live interactive architecture layers. Drag to pan, wheel to zoom.</span>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('schematicCanvas');
    const ctx = canvas.getContext('2d');
    const subjectLabel = document.getElementById('subject');
    const layerTitle = document.getElementById('layerTitle');
    const layerDescription = document.getElementById('layerDescription');
    const params = new URLSearchParams(location.search);
    subjectLabel.textContent = params.get('subject') || 'Core architecture';

    let layer = 'all';
    let scale = 1;
    let offset = { x: 0, y: 0 };
    let drag = null;
    const nodes = [
      { id: 'CORE', x: 0, y: 0, r: 58 },
      { id: 'ATLAS', x: -220, y: -120, r: 34 },
      { id: 'PULSE', x: 220, y: -120, r: 34 },
      { id: 'VISION', x: -220, y: 130, r: 34 },
      { id: 'ECHO', x: 220, y: 130, r: 34 },
      { id: 'NEXUS', x: 0, y: 230, r: 34 },
      { id: 'FORGE', x: 0, y: -240, r: 34 }
    ];

    function resize() {
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function project(point) {
      return {
        x: canvas.clientWidth / 2 + (point.x + offset.x) * scale,
        y: canvas.clientHeight / 2 + (point.y + offset.y) * scale
      };
    }

    function drawNode(node, color) {
      const p = project(node);
      const r = node.r * scale;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(2, 6, 11, 0.74)';
      ctx.fill();
      ctx.shadowBlur = 22;
      ctx.shadowColor = color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#c3f5ff';
      ctx.font = '12px Orbitron, Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(node.id, p.x, p.y + 4);
    }

    function drawConnection(a, b, color, dash = []) {
      const pa = project(a);
      const pb = project(b);
      ctx.save();
      ctx.setLineDash(dash);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      const grid = 34 * scale;
      ctx.strokeStyle = 'rgba(0,218,243,0.055)';
      ctx.lineWidth = 1;
      for (let x = (canvas.clientWidth / 2 + offset.x * scale) % grid; x < canvas.clientWidth; x += grid) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.clientHeight); ctx.stroke();
      }
      for (let y = (canvas.clientHeight / 2 + offset.y * scale) % grid; y < canvas.clientHeight; y += grid) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.clientWidth, y); ctx.stroke();
      }

      const core = nodes[0];
      nodes.slice(1).forEach((node, index) => {
        if (layer === 'power' || layer === 'all') drawConnection(core, node, 'rgba(245,158,11,0.58)', [8, 8]);
        if (layer === 'data' || layer === 'all') drawConnection(node, nodes[(index + 2) % (nodes.length - 1) + 1], 'rgba(0,218,243,0.42)');
        if (layer === 'thermal') drawConnection(core, node, 'rgba(239,68,68,0.38)', [3, 10]);
      });
      nodes.forEach(node => {
        const color = layer === 'thermal' ? '#ef4444' : layer === 'power' ? '#f59e0b' : layer === 'data' ? '#00daf3' : '#9cf0ff';
        drawNode(node, color);
      });
    }

    document.querySelectorAll('button[data-layer]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('button[data-layer]').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        layer = button.dataset.layer;
        const labels = {
          all: ['All layers active', 'Displaying power, data, thermal, and rack relationships.'],
          power: ['Power grid layer', 'Backup and primary distribution paths highlighted.'],
          data: ['Data flow layer', 'Core message routes between specialist modules highlighted.'],
          thermal: ['Thermal map layer', 'Heat-risk zones and load paths highlighted.'],
          rack: ['Server rack layer', 'Logical rack placement and module grouping highlighted.']
        };
        layerTitle.textContent = labels[layer][0];
        layerDescription.textContent = labels[layer][1];
      });
    });

    canvas.addEventListener('pointerdown', event => {
      drag = { x: event.clientX, y: event.clientY, ox: offset.x, oy: offset.y };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag) return;
      offset.x = drag.ox + (event.clientX - drag.x) / scale;
      offset.y = drag.oy + (event.clientY - drag.y) / scale;
    });
    canvas.addEventListener('pointerup', () => { drag = null; });
    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      scale = Math.min(2.4, Math.max(0.55, scale + (event.deltaY < 0 ? 0.08 : -0.08)));
    }, { passive: false });

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
