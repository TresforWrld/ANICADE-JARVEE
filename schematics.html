<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCHEMA Dynamic Schematic</title>
  <style>
    :root {
      --bg: #06101c;
      --panel: rgba(2, 6, 11, 0.58);
      --primary: #00daf3;
      --secondary: #b0c6ff;
      --tertiary: #ffb778;
      --text: #dfe2eb;
      --muted: rgba(223, 226, 235, 0.62);
      --mono: "JetBrains Mono", Consolas, monospace;
      --body: system-ui, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      border: 0 !important;
      outline: 0 !important;
      letter-spacing: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
    }

    main {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 48%, rgba(0, 218, 243, 0.16), transparent 46%),
        linear-gradient(135deg, rgba(176, 198, 255, 0.07), transparent 42%);
    }

    header {
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 8px;
      background: linear-gradient(180deg, rgba(2, 6, 11, 0.82), transparent);
    }

    h1 {
      margin: 0;
      color: #c3f5ff;
      font-size: clamp(18px, 2.4vw, 28px);
      line-height: 1.1;
    }

    p,
    .meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layer-pill {
      min-height: 34px;
      padding: 0 12px;
      display: inline-grid;
      place-items: center;
      color: var(--text);
      background: rgba(16, 20, 26, 0.68);
      border-radius: 8px;
    }

    .layer-pill.active {
      color: #001f24;
      background: var(--primary);
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
      margin: 0 12px 12px;
      overflow: hidden;
      background: var(--panel);
      border-radius: 8px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .corner-data {
      position: absolute;
      left: 14px;
      bottom: 12px;
      padding: 10px 12px;
      background: rgba(2, 6, 11, 0.72);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
    }

    .corner-data strong {
      display: block;
      color: var(--primary);
      font-size: 13px;
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">SCHEMA</h1>
        <p id="summary">Generating dynamic schematic.</p>
      </div>
      <div class="toolbar" aria-label="Schematic layers">
        <span data-layer="systems" class="layer-pill active">Systems</span>
        <span data-layer="data" class="layer-pill">Data</span>
        <span data-layer="power" class="layer-pill">Power</span>
        <span data-layer="risk" class="layer-pill">Risk</span>
      </div>
    </header>
    <section class="canvas-wrap">
      <canvas id="schematicCanvas"></canvas>
      <div class="corner-data">
        ACTIVE_LAYER
        <strong id="layerLabel">Systems</strong>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const canvas = document.getElementById("schematicCanvas");
    const ctx = canvas.getContext("2d");
    const title = document.getElementById("title");
    const summary = document.getElementById("summary");
    const layerLabel = document.getElementById("layerLabel");
    let subject = params.get("subject") || "modular AI assistant architecture";
    let activeLayer = "systems";
    let tick = 0;

    const palettes = {
      systems: ["#00daf3", "#b0c6ff", "#72f7d1"],
      data: ["#b0c6ff", "#00daf3", "#d8b4fe"],
      power: ["#ffb778", "#fde68a", "#00daf3"],
      risk: ["#ff8a80", "#ffb778", "#b0c6ff"]
    };

    function tokenize(value) {
      const words = String(value)
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, " ")
        .split(/\s+/)
        .filter(Boolean);
      return [...new Set(words.length ? words : ["system", "module", "control"])];
    }

    function modulesForSubject(value) {
      const tokens = tokenize(value);
      const base = [
        "Input Capture",
        "Control Core",
        "Policy Gate",
        "Data Plane",
        "Telemetry",
        "Output Surface",
        "Automation Bus",
        "Failover"
      ];
      return base.map((label, index) => {
        const token = tokens[index % tokens.length];
        return `${label}: ${token.toUpperCase()}`;
      });
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(320, rect.width) * devicePixelRatio;
      canvas.height = Math.max(240, rect.height) * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function drawGrid(w, h) {
      ctx.strokeStyle = "rgba(0, 218, 243, 0.07)";
      ctx.lineWidth = 1;
      for (let x = (tick % 34); x < w; x += 34) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = (tick % 34); y < h; y += 34) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
    }

    function drawNode(x, y, width, height, label, index, palette) {
      const pulse = 0.55 + Math.sin(tick / 28 + index) * 0.2;
      ctx.fillStyle = "rgba(6, 16, 28, 0.76)";
      ctx.fillRect(x, y, width, height);
      ctx.fillStyle = palette[index % palette.length];
      ctx.globalAlpha = pulse;
      ctx.fillRect(x, y, 5, height);
      ctx.globalAlpha = 1;
      ctx.font = "11px JetBrains Mono, Consolas, monospace";
      ctx.fillStyle = "rgba(223, 226, 235, 0.86)";
      wrapText(label, x + 14, y + 22, width - 24, 15);
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      for (const word of words) {
        const testLine = `${line}${word} `;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = `${word} `;
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function drawConnections(nodes, palette) {
      ctx.lineWidth = 1.5;
      nodes.forEach((node, index) => {
        const next = nodes[(index + 1) % nodes.length];
        const color = palette[index % palette.length];
        ctx.strokeStyle = color + "88";
        ctx.beginPath();
        ctx.moveTo(node.x + node.w / 2, node.y + node.h / 2);
        const midX = (node.x + next.x) / 2 + Math.sin(tick / 50 + index) * 24;
        const midY = (node.y + next.y) / 2 + Math.cos(tick / 50 + index) * 24;
        ctx.quadraticCurveTo(midX, midY, next.x + next.w / 2, next.y + next.h / 2);
        ctx.stroke();
      });
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      tick += 1;
      ctx.clearRect(0, 0, w, h);
      const gradient = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
      gradient.addColorStop(0, "rgba(0, 218, 243, 0.12)");
      gradient.addColorStop(1, "rgba(2, 6, 11, 0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      drawGrid(w, h);

      const labels = modulesForSubject(subject);
      const palette = palettes[activeLayer] || palettes.systems;
      const centerX = w / 2;
      const centerY = h / 2;
      const radiusX = Math.max(140, w * 0.34);
      const radiusY = Math.max(95, h * 0.29);
      const nodeW = Math.min(210, Math.max(145, w * 0.2));
      const nodeH = 58;
      const nodes = labels.map((label, index) => {
        const angle = (Math.PI * 2 * index) / labels.length - Math.PI / 2;
        return {
          label,
          x: centerX + Math.cos(angle) * radiusX - nodeW / 2,
          y: centerY + Math.sin(angle) * radiusY - nodeH / 2,
          w: nodeW,
          h: nodeH
        };
      });

      drawConnections(nodes, palette);

      ctx.fillStyle = "rgba(2, 6, 11, 0.8)";
      ctx.beginPath();
      ctx.arc(centerX, centerY, Math.min(84, w * 0.1), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette[0];
      ctx.font = "700 12px JetBrains Mono, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText(activeLayer.toUpperCase(), centerX, centerY - 4);
      ctx.fillStyle = "rgba(223,226,235,0.72)";
      ctx.font = "10px JetBrains Mono, Consolas, monospace";
      ctx.fillText("CORE", centerX, centerY + 14);
      ctx.textAlign = "left";

      nodes.forEach((node, index) => drawNode(node.x, node.y, node.w, node.h, node.label, index, palette));
      requestAnimationFrame(draw);
    }

    function setSubject(nextSubject) {
      subject = nextSubject || subject;
      title.textContent = `SCHEMA: ${subject}`;
      summary.textContent = `Dynamic blueprint generated from "${subject}".`;
      window.parent.postMessage({ type: "schematic_ready", subject }, "*");
    }

    window.addEventListener("resize", resize);
    window.addEventListener("message", event => {
      if (!event.data || typeof event.data !== "object") return;
      if (event.data.type === "schematic_subject") setSubject(event.data.subject);
      if (event.data.type === "schematic_layer") {
        activeLayer = event.data.layer || activeLayer;
        layerLabel.textContent = activeLayer[0].toUpperCase() + activeLayer.slice(1);
      }
    });

    resize();
    setSubject(subject);
    draw();
  </script>
</body>
</html>
