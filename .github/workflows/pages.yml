name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate production config
        run: |
          cat > config.js <<'EOF'
          window.JARVIS_CONFIG = {
            wakeWord: 'jarvis',
            WAKE_WORD: 'jarvis',
            language: 'en-GB',
            ttsRate: 1.05,
            ttsPitch: 0.92,
            geminiModel: 'gemini-2.0-flash',
            geminiApiKey: '${{ secrets.GEMINI_API_KEY }}',
            GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}',
            claudeApiKey: '${{ secrets.CLAUDE_API_KEY }}',
            CLAUDE_API_KEY: '${{ secrets.CLAUDE_API_KEY }}',
            googleClientId: '${{ secrets.GOOGLE_CLIENT_ID }}',
            GOOGLE_CLIENT_ID: '${{ secrets.GOOGLE_CLIENT_ID }}',
            facebookAppId: '${{ secrets.FACEBOOK_APP_ID }}',
            FACEBOOK_APP_ID: '${{ secrets.FACEBOOK_APP_ID }}',
            jsonbinId: '${{ secrets.JSONBIN_ID }}',
            jsonbinKey: '${{ secrets.JSONBIN_KEY }}',
            jsonbinAccessKey: '${{ secrets.JSONBIN_ACCESS_KEY }}'
          };
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
